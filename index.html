  <!-- ===== PUNCH HOLE EFFECT ===== -->
  <script>
    document.querySelectorAll('.punch-sign').forEach(function (sign) {
      sign.addEventListener('click', function (e) {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        e.preventDefault();
        if (sign.classList.contains('punched')) return;

        // where the hit landed (center of the sign if they used the keyboard)
        var box = sign.getBoundingClientRect();
        var x = e.detail === 0 ? box.width / 2 : e.clientX - box.left;
        var y = e.detail === 0 ? box.height / 2 : e.clientY - box.top;

        // the hole
        sign.style.setProperty('--hx', (x - 45) + 'px');
        sign.style.setProperty('--hy', (y - 45) + 'px');
        sign.classList.add('punched');

        // the cracks
        var svgNS = 'http://www.w3.org/2000/svg';
        var cracks = document.createElementNS(svgNS, 'svg');
        cracks.setAttribute('class', 'punch-cracks');
        cracks.setAttribute('viewBox', '-90 -90 180 180');
        cracks.style.left = (x - 90) + 'px';
        cracks.style.top = (y - 90) + 'px';
        ['M30 -20 L52 -34 L70 -30', 'M38 10 L60 18 L76 38', 'M8 40 L4 62 L18 80',
         'M-30 30 L-52 44 L-60 70', 'M-40 -6 L-64 -14 L-82 -4', 'M-12 -40 L-20 -62 L-8 -82']
          .forEach(function (d) {
            var p = document.createElementNS(svgNS, 'path');
            p.setAttribute('d', d);
            cracks.appendChild(p);
          });
        sign.appendChild(cracks);

        // the flying chips
        var chips = [];
        for (var i = 0; i < 8; i++) {
          var chip = document.createElement('span');
          chip.className = 'punch-chip';
          var angle = Math.random() * Math.PI * 2;
          var dist = 60 + Math.random() * 70;
          chip.style.left = (x - 6) + 'px';
          chip.style.top = (y - 5) + 'px';
          chip.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
          chip.style.setProperty('--dy', Math.sin(angle) * dist + 40 + 'px');
          chip.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
          sign.appendChild(chip);
          chips.push(chip);
        }

        // open the form after a beat
        setTimeout(function () {
          var win = window.open(sign.href, '_blank');
          if (win) { win.opener = null; } else { window.location.href = sign.href; }
        }, 350);

        // patch the sign back up for when they come back
        setTimeout(function () {
          sign.classList.remove('punched');
          cracks.remove();
          chips.forEach(function (c) { c.remove(); });
        }, 1600);
      });
    });
  </script>


  <!-- ===== GUESTBOOK PORTAL + STORM ===== -->
  <script>
    var guestbook = document.getElementById('guestbook-icon');

    guestbook.addEventListener('click', function (e) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      e.preventDefault();

      // a second click skips straight to the guestbook
      if (guestbook.classList.contains('portal-open')) {
        window.location.href = guestbook.href;
        return;
      }

      guestbook.classList.add('portal-open');

      // the black screen
      var storm = document.createElement('div');
      storm.className = 'storm';
      document.body.appendChild(storm);

      // lightning strikes, spaced apart so it never flashes more than 3 times a second
      [500, 1100, 1700].forEach(function (time) {
        setTimeout(function () { strike(storm); }, time);
      });

      // go to the guestbook
      setTimeout(function () {
        window.location.href = guestbook.href;
      }, 2300);
    });

    // one lightning strike: a dim flash plus a jagged bolt
    function strike(storm) {
      storm.classList.remove('flash');
      void storm.offsetWidth;          // restarts the flash animation
      storm.classList.add('flash');

      var w = window.innerWidth;
      var h = window.innerHeight;
      var x = Math.random() * w;
      var y = 0;
      var points = [x + ',' + y];

      // zig-zag down from the top of the screen
      while (y < h * (0.5 + Math.random() * 0.4)) {
        x += (Math.random() - 0.5) * 120;
        y += 30 + Math.random() * 50;
        points.push(x + ',' + y);
      }

      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('class', 'bolt');
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      var line = document.createElementNS(svgNS, 'polyline');
      line.setAttribute('points', points.join(' '));
      svg.appendChild(line);
      storm.appendChild(svg);

      setTimeout(function () { svg.remove(); }, 500);
    }

    // clean everything up if they come back with the back button
    window.addEventListener('pageshow', function () {
      guestbook.classList.remove('portal-open');
      document.querySelectorAll('.storm').forEach(function (s) { s.remove(); });
    });
  </script>


  <!-- ===== SWITCHBOARD OPEN / CLOSE ===== -->
  <script>
    var phone = document.getElementById('chat-phone');
    var switchboard = document.getElementById('switchboard');

    // the phone picks up or hangs up

    // hang up button
    switchboard.querySelector('.chat-hangup').addEventListener('click', function (e) {
      e.preventDefault();
      switchboard.classList.remove('open');
